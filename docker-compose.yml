services:
  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ConnectionStrings__Default=Host=postgres;Database=ai_knowledge_base;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/Worker/Dockerfile
    environment:
      - ConnectionStrings__Default=Host=postgres;Database=ai_knowledge_base;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_knowledge_base
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
